<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Terrain</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <b>Terrain</b>
      <span id="status">ready</span>
      <button id="new">New land</button>
      <label>Relief <input id="amp" type="range" min="0" max="20" step="0.5" value="6" /></label>
      <button id="water">Water</button>
      <button data-tool="hill">Hill</button>
      <button data-tool="valley">Valley</button>
      <button data-tool="pad">Pad</button>
      <button data-tool="cliff">Cliff</button>
      <button data-tool="rocks">Rocks</button>
      <button id="frame">Frame</button>
    </header>
    <div id="view"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
