<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Plant designer</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <b>Plant designer</b>
      <span id="status">ready</span>
      <select id="template" title="Start from a template"></select>
      <select id="crown" title="Crown shape"></select>
      <select id="leaf" title="Foliage"></select>
      <select id="bark" title="Bark"></select>
      <label>Height <input id="height" type="number" min="0.3" max="40" step="0.5" style="width: 46px" /></label>
      <label>Leaf <input id="size" type="range" min="0.03" max="0.5" step="0.005" /></label>
      <label>Density <input id="density" type="range" min="1" max="20" step="1" /></label>
      <input id="tint" type="color" title="Foliage tint" />
      <button id="reseed">Reseed</button>
      <button id="variant">Variant</button>
      <button id="save">Save</button>
      <label><input id="count" type="number" min="1" max="200" value="12" style="width: 44px" /></label>
      <button id="add">Add to scene</button>
      <button id="frame">Frame</button>
    </header>
    <div id="view"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
