<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Buildings</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header>
      <b>Buildings</b>
      <span id="status">ready</span>
      <label>Floors <input id="floors" type="number" min="1" max="12" value="2" style="width: 40px" /></label>
      <label>Turn <input id="rot" type="number" step="15" value="0" style="width: 48px" /></label>
      <select id="roof"></select>
      <select id="wall"></select>
      <select id="roofMaterial"></select>
      <button id="settle">Settle</button>
      <button id="clear">Clear</button>
      <label><input id="context" type="checkbox" /> Context</label>
      <button id="frame">Frame</button>
    </header>
    <div id="view"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
