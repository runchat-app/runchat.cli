<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Watercolour</title>
    <style>
      html, body { margin: 0; height: 100%; font: 12px "Hanken Grotesk", system-ui, sans-serif; background: #ebe6dc; color: #2a2a2a; }
      body { display: flex; flex-direction: column; }
      header { display: flex; gap: 10px; align-items: center; padding: 6px 10px; background: #f6f3ee; border-bottom: 1px solid #ddd5c7; }
      #status { color: #8a8378; flex: 1; }
      #palette { display: flex; gap: 4px; }
      #palette button { width: 18px; height: 18px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer; }
      #palette button.on { border-color: #2a2a2a; }
      main { flex: 1; min-height: 0; position: relative; overflow: hidden; }
      canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); box-shadow: 0 1px 6px rgba(0,0,0,.15); cursor: crosshair; touch-action: none; }
    </style>
  </head>
  <body>
    <header>
      <b>Watercolour</b>
      <span id="status">connecting…</span>
      <span id="palette"></span>
      <input id="width" type="range" min="4" max="80" value="18" title="Brush width" />
      <button id="undo">Undo</button>
    </header>
    <main><canvas id="sheet"></canvas></main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
